<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Factory dashboard · YT Factory</title>
    <meta name="description" content="Channels, people, access tokens and pipeline stats for the YT factory." />
    <meta name="theme-color" content="#f6f3f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Factory" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style id="expo-reset">#root { display: block; min-height: 100%; }</style>
  </head>
  <body>
    <noscript>The factory dashboard needs JavaScript to reach the factory API.</noscript>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator && location.hostname !== "localhost") {
        window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
      }
    </script>
  </body>
</html>
